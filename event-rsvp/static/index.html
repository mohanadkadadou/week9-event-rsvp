<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event RSVP</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#1d2330;--mut:#6b7385;--pri:#4f46e5;--err:#c0262d;--ok:#1a7f4b;--bd:#dfe3ec}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--pri);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;text-decoration:none;font-weight:600}main{max-width:760px;margin:24px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 4px}.mut{color:var(--mut);font-size:14px}
button,.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
button.sec{background:#e8eaf3;color:var(--ink)}button.danger{background:var(--err)}button:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-weight:600;margin-top:12px}input,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;font:inherit}
.err{color:var(--err);font-size:14px}.bad{border-color:var(--err)}.banner{padding:10px 12px;border-radius:8px;margin-bottom:12px}
.banner.e{background:#fde8e9;color:var(--err)}.banner.o{background:#e3f6ec;color:var(--ok)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;background:#e8eaf3;font-size:14px}.badge.full{background:#fde8e9;color:var(--err);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.radio{display:flex;gap:16px;margin-top:6px}.radio label{margin:0;font-weight:400}.radio input{width:auto}
</style></head><body>
<header><a href="#/">Event RSVP</a><a href="#/new">+ Create event</a></header>
<main id="app"></main>
<script>
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{const d=new Date(s);return isNaN(d)?s:d.toLocaleString([], {dateStyle:'medium',timeStyle:'short'})};
async function api(method,url,body){
  const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const d=r.status===204?null:await r.json().catch(()=>({error:'Unexpected response.'}));
  if(!r.ok){const e=new Error(d.error||'Request failed');e.fields=d.fields||{};throw e}
  return d;
}
const badge=e=>`<span class="badge ${e.full?'full':''}">${e.yes_count} / ${e.capacity} going${e.full?' &middot; Event full':''}</span>`;
const fe=(f,k)=>f[k]?`<div class="err">${esc(f[k])}</div>`:'';

async function list(){
  app.innerHTML='<p class="mut">Loading...</p>';
  const evs=await api('GET','/api/events');
  app.innerHTML='<h2>Upcoming events</h2>'+(evs.length?evs.map(e=>`<div class="card"><h3><a href="#/event/${e.id}">${esc(e.title)}</a></h3>
   <div class="mut">${esc(fmt(e.date_time))} &middot; ${esc(e.location)}</div><div class="row">${badge(e)}</div></div>`).join(''):
   '<div class="card">No events yet. <a href="#/new">Create the first one.</a></div>');
}
function form(ev,errMsg,f){
  f=f||{};ev=ev||{};
  const inp=(k,l,t='text')=>`<label>${l}<input type="${t}" name="${k}" value="${esc(ev[k])}" class="${f[k]?'bad':''}"></label>${fe(f,k)}`;
  return `${errMsg?`<div class="banner e">${esc(errMsg)}</div>`:''}<form id="f" novalidate>
   ${inp('title','Title')}<label>Description<textarea name="description" rows="3">${esc(ev.description)}</textarea></label>
   ${inp('date_time','Date and time','datetime-local')}${inp('location','Location')}${inp('capacity','Capacity','number')}
   <div class="row"><button>Save</button><a class="btn sec" href="#/">Cancel</a></div></form>`;
}
async function eventForm(id){
  let ev=id?await api('GET','/api/events/'+id):{capacity:20};
  const draw=(m,f,v)=>{
    app.innerHTML=`<h2>${id?'Edit':'Create'} event</h2><div class="card">${form(v||ev,m,f)}</div>`;
    document.getElementById('f').onsubmit=async x=>{x.preventDefault();
      const v=Object.fromEntries(new FormData(x.target));
      try{const r=id?await api('PUT','/api/events/'+id,v):await api('POST','/api/events',v);location.hash='#/event/'+r.id}
      catch(e){draw(e.message,e.fields,v)}};
  };draw();
}
async function detail(id,msg){
  const e=await api('GET','/api/events/'+id);
  app.innerHTML=`<div class="card"><h2 style="margin-top:0">${esc(e.title)}</h2>
   <div class="mut">${esc(fmt(e.date_time))} &middot; ${esc(e.location)}</div>
   <p style="white-space:pre-wrap">${esc(e.description)}</p>${badge(e)}
   <div class="row"><a class="btn sec" href="#/edit/${id}">Edit</a><button class="danger" id="del">Delete</button></div></div>
   <div class="card"><h3>RSVP</h3><div id="msg">${msg||''}</div>
   ${e.full?'<div class="banner e">Event full. New "yes" RSVPs are closed, but you can still RSVP "no".</div>':''}
   <form id="r" novalidate><label>Name<input name="name"></label><div id="e-name"></div>
   <label>Email<input name="email" type="email"></label><div id="e-email"></div>
   <div class="radio"><label><input type="radio" name="status" value="yes" checked> Yes, I'm going</label>
   <label><input type="radio" name="status" value="no"> No</label></div>
   <div class="row"><button>Submit RSVP</button></div></form></div>
   <div class="card"><h3>Attendees (${e.rsvps.length})</h3>${e.rsvps.length?e.rsvps.map(r=>`<div>${esc(r.name)} <span class="mut">- ${r.status}</span></div>`).join(''):'<span class="mut">No RSVPs yet.</span>'}</div>
   <a href="#/">&larr; All events</a>`;
  document.getElementById('del').onclick=async()=>{if(confirm('Delete this event and all its RSVPs?')){await api('DELETE','/api/events/'+id);location.hash='#/'}};
  document.getElementById('r').onsubmit=async x=>{x.preventDefault();
    const v=Object.fromEntries(new FormData(x.target));
    try{await api('POST',`/api/events/${id}/rsvps`,v);detail(id,'<div class="banner o">Thanks, your RSVP was saved.</div>')}
    catch(er){document.getElementById('msg').innerHTML=`<div class="banner e">${esc(er.message)}</div>`;
      ['name','email'].forEach(k=>document.getElementById('e-'+k).innerHTML=fe(er.fields,k))}};
}
async function route(){
  const p=location.hash.slice(1).split('/').filter(Boolean);
  try{
    if(!p.length)await list();else if(p[0]==='new')await eventForm();
    else if(p[0]==='edit')await eventForm(p[1]);else if(p[0]==='event')await detail(p[1]);else await list();
  }catch(e){app.innerHTML=`<div class="banner e">${esc(e.message)} <a href="#/">Back to events</a></div>`}
}
addEventListener('hashchange',route);route();
setInterval(()=>{if(/^#\/event\//.test(location.hash)&&!document.activeElement.closest?.('form')&&!document.querySelector('#msg .banner'))route()},10000);
</script></body></html>
